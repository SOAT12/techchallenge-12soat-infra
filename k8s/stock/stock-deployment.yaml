apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-api-deployment
  labels:
    app: stock-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-api
  template:
    metadata:
      labels:
        app: stock-api
    spec:
      serviceAccountName: stock-sa
      containers:
      - name: stock-api
        image: 258531703731.dkr.ecr.us-east-1.amazonaws.com/stock-api:latest # This will be your registry image url
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY
          value: "dummy"
        - name: SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
          value: "dummy"
        envFrom:
        - secretRef:
            name: stock-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
